on: [push, pull_request]
name: Build and test
jobs:
  check-generated-sources:
    name: Check generated sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        name: Setup Haskell
        with:
          ghc-version: '9.12'

      - name: Generate sources
        run: |
          cabal run script/Gen.hs
          cabal run script/GenVL.hs
          cabal run script/GenPrim.hs

      - name: Check the generated sources are up-to-date
        run: |
          git add --intent-to-add .
          if ! git diff --exit-code; then
            echo "::error::The generated sources are out of date. Run 'cabal run script/Gen.hs', 'cabal run script/GenVL.hs' and 'cabal run script/GenPrim.hs', and commit the result."
            exit 1
          fi

  build-and-test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.8', '9.10', '9.12', '9.14']
        os: [ubuntu-22.04, ubuntu-24.04, macos-15-intel, macos-14, windows-latest]
        flags: ['', '--flags no-simd', '--flags haswell', '--flags avx512', '--flags -llvm']
        # Other possible combinations: "haswell -llvm", "avx512 -llvm"
        exclude:
          # Ubuntu 24.04 doesn't contain LLVM 12
          - ghc: '9.8'
            os: ubuntu-24.04
          # Ubuntu 22.04 doesn't contain LLVM 15
          - ghc: '9.10'
            os: ubuntu-22.04
          - ghc: '9.12'
            os: ubuntu-22.04
          - ghc: '9.14'
            os: ubuntu-22.04
          # LLVM on Windows requires GHC >= 9.12
          - ghc: '9.8'
            os: windows-latest
          - ghc: '9.10'
            os: windows-latest
          # LLVM 12 is not available with Homebrew
          - ghc: '9.8'
            os: macos-15-intel
          # AArch64 NEON support requires GHC >= 9.12 (9.8 and 9.10 have a problem with FFI)
          - ghc: '9.8'
            os: macos-14
          - ghc: '9.10'
            os: macos-14
          # x86-only features
          - os: macos-14
            flags: '--flags haswell'
          - os: macos-14
            flags: '--flags avx512'
          # NCG needs GHC 9.12 or later
          - ghc: '9.8'
            flags: '--flags -llvm'
          - ghc: '9.10'
            flags: '--flags -llvm'
    steps:
      - uses: actions/checkout@v6

      - name: Install LLVM 12 with APT
        run: |
          sudo apt-get install llvm-12 clang-12
          echo "OPT=opt-12" >> "${GITHUB_ENV}"
          echo "LLC=llc-12" >> "${GITHUB_ENV}"
          echo "LLVMAS=clang-12" >> "${GITHUB_ENV}"
        if: ${{ matrix.os == 'ubuntu-22.04' && matrix.ghc == '9.8' }}

      - name: Install LLVM 15 with Homebrew
        run: |
          brew install llvm@15
          echo "OPT=$(brew --prefix llvm@15)/bin/opt" >> "${GITHUB_ENV}"
          echo "LLC=$(brew --prefix llvm@15)/bin/llc" >> "${GITHUB_ENV}"
        if: ${{ (matrix.os == 'macos-15-intel' || matrix.os == 'macos-14') && (matrix.ghc == '9.10' || matrix.ghc == '9.12' || matrix.ghc == '9.14') }}

      - name: Install LLVM 15 with APT
        run: |
          sudo apt-get install llvm-15 clang-15
          echo "OPT=opt-15" >> "${GITHUB_ENV}"
          echo "LLC=llc-15" >> "${GITHUB_ENV}"
          echo "LLVMAS=clang-15" >> "${GITHUB_ENV}"
        if: ${{ matrix.os == 'ubuntu-24.04' && (matrix.ghc == '9.10' || matrix.ghc == '9.12' || matrix.ghc == '9.14') }}

      - uses: haskell-actions/setup@v2
        name: Setup Haskell
        with:
          ghc-version: ${{ matrix.ghc }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
          key: ${{ runner.os }}-${{ matrix.ghc }}

      # Cmm lint fails with older GHCs
      - name: Configure without Cmm lint
        run: cabal configure --ghc-options="-pgmlo $OPT -pgmlc $LLC -dcore-lint -dstg-lint -dasm-lint -fllvm-fill-undef-with-garbage -fcatch-nonexhaustive-cases -debug -fcheck-prim-bounds -fno-ignore-asserts" --enable-test --enable-benchmarks
        if: ${{ matrix.ghc == '9.8' || matrix.ghc == '9.10' }}

      - name: Configure with Cmm lint (non-Windows)
        run: cabal configure --ghc-options="-pgmlo $OPT -pgmlc $LLC -dlint -fcheck-prim-bounds -fno-ignore-asserts" --enable-test --enable-benchmarks
        if: ${{ (matrix.ghc == '9.12' || matrix.ghc == '9.14') && matrix.os != 'windows-latest' }}

      - name: Configure with Cmm lint (Windows)
        run: cabal configure --ghc-options="-dlint -fcheck-prim-bounds -fno-ignore-asserts" --enable-test --enable-benchmarks
        if: ${{ (matrix.ghc == '9.12' || matrix.ghc == '9.14') && matrix.os == 'windows-latest' }}

      - name: Build
        run: cabal build ${{ matrix.flags }}

      - name: Test
        run: cabal test ${{ matrix.flags }}
        if: ${{ matrix.flags != '--flags avx512' }}
        # AVX-512 may not be available on the runner

  build-and-test-with-nightly:
    name: Build and test (nightly GHC)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.12.4.20260713', '9.14.1.20260728', 'latest-nightly']
        os: [ubuntu-24.04, macos-15-intel, macos-14, windows-latest]
        flags: ['', '--flags no-simd', '--flags haswell', '--flags avx512', '--flags -llvm']
        # Other possible combinations: "haswell -llvm", "avx512 -llvm"
        exclude:
          # x86-only features
          - os: macos-14
            flags: '--flags haswell'
          - os: macos-14
            flags: '--flags avx512'
    steps:
      - uses: actions/checkout@v6

      - name: Install LLVM 19 with Homebrew
        run: |
          brew install llvm@19
          echo "OPT=$(brew --prefix llvm@19)/bin/opt" >> "${GITHUB_ENV}"
          echo "LLC=$(brew --prefix llvm@19)/bin/llc" >> "${GITHUB_ENV}"
        if: ${{ matrix.os == 'macos-15-intel' || matrix.os == 'macos-14' }}

      - name: Install LLVM 19 with APT
        run: |
          sudo apt-get install llvm-19 clang-19
          echo "OPT=opt-19" >> "${GITHUB_ENV}"
          echo "LLC=llc-19" >> "${GITHUB_ENV}"
          echo "LLVMAS=clang-19" >> "${GITHUB_ENV}"
        if: ${{ matrix.os == 'ubuntu-24.04' }}

      - uses: haskell/ghcup-setup@v1
        with:
          ghc: ${{ matrix.ghc }}
          config: |
            # don't cache metadata files based on last access time
            meta-cache: 0
            url-source:
              - GHCupURL
              - prereleases
              - https://ghc.gitlab.haskell.org/ghcup-metadata/ghcup-nightlies-0.0.7.yaml

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
          key: ${{ runner.os }}-${{ matrix.ghc }}

      - name: cabal update
        run: cabal update

      - name: Configure with Cmm lint (non-Windows)
        run: cabal configure --ghc-options="-pgmlo $OPT -pgmlc $LLC -dlint -fcheck-prim-bounds -fno-ignore-asserts" --enable-test --enable-benchmarks --allow-newer
        if: ${{ matrix.os != 'windows-latest' }}

      - name: Configure with Cmm lint (Windows)
        run: cabal configure --ghc-options="-dlint -fcheck-prim-bounds -fno-ignore-asserts" --enable-test --enable-benchmarks --allow-newer
        if: ${{ matrix.os == 'windows-latest' }}

      - name: Build
        run: cabal build ${{ matrix.flags }}

      - name: Test
        run: cabal test ${{ matrix.flags }}
        if: ${{ matrix.flags != '--flags avx512' }}
        # AVX-512 may not be available on the runner
